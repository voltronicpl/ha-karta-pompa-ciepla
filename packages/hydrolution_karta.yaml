# =====================================================================
# Pakiet HA pod karte "Pompa ciepla" (ESPHome hydrolution v5.3)
# Wrzuc do /config/packages/ i dodaj w configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Encje ESP zakladaja domyslne nazwy z v5.3 (sensor.hydrolution_...). Plan offline (v1.34) wymaga ESP v5.5.
# NAPIECIE ponizej (230 V) - do szacowania mocy elektrycznej z pradu jednostki zewn.
# WERSJA PAKIETU: 1.40 (sensor.hp_pakiet_wersja). Karta porownuje ja z oczekiwana i pokazuje
# zolte ostrzezenie, gdy w HA siedzi starszy pakiet. Po wklejeniu: PELNY restart HA.
# =====================================================================

template:
  # v1.18: aktywnosc w domu (swiatla, ruch/obecnosc, ekran telefonu, media) - do wykrycia weekendowego wstania
  - binary_sensor:
      - name: "HP aktywnosc w domu"
        unique_id: hp_aktywnosc_w_domu
        icon: mdi:human-greeting
        state: >
          {{ (states.light | selectattr('state', 'eq', 'on') | list | count > 0)
             or (states.binary_sensor | selectattr('attributes.device_class', 'defined')
                 | selectattr('attributes.device_class', 'in', ['motion', 'occupancy', 'presence'])
                 | selectattr('state', 'eq', 'on') | list | count > 0)
             or (states.binary_sensor | selectattr('entity_id', 'search', 'interactive') | selectattr('state', 'eq', 'on') | list | count > 0)
             or (states.media_player | selectattr('state', 'in', ['on', 'playing']) | list | count > 0) }}
  # v1.23: taryfa G12 (PGE, standard): tania strefa wg input_text.hp_g12_strefy (domyslnie 22:00-06:00,13:00-15:00),
  #        opcjonalnie So-Nd cala doba (input_boolean.hp_g12_weekend_tani, domyslnie wylaczony)
  - binary_sensor:
      - name: "HP G12 tania strefa"
        unique_id: hp_g12_tania
        icon: mdi:cash-clock
        state: >
          {% set s = states('input_text.hp_g12_strefy') %}
          {% if s in ['', 'unknown', 'unavailable'] %}{% set s = '22:00-06:00,13:00-15:00' %}{% endif %}
          {% set m = now().hour * 60 + now().minute %}
          {% set ns = namespace(on = is_state('input_boolean.hp_g12_weekend_tani', 'on') and now().weekday() >= 5) %}
          {% for z in s.split(',') %}{% set p = z.strip().split('-') %}{% if p | count == 2 and ':' in p[0] and ':' in p[1] %}
          {% set a = (p[0].split(':')[0] | int(0)) * 60 + (p[0].split(':')[1] | int(0)) %}
          {% set b = (p[1].split(':')[0] | int(0)) * 60 + (p[1].split(':')[1] | int(0)) %}
          {% if (a < b and a <= m < b) or (a > b and (m >= a or m < b)) %}{% set ns.on = true %}{% endif %}
          {% endif %}{% endfor %}
          {{ ns.on }}
  - sensor:
      # v1.23: ile minut do poczatku najblizszej taniej strefy G12 (0 = teraz tania)
      - name: "HP G12 do taniej"
        unique_id: hp_g12_do_taniej
        icon: mdi:timer-sand
        unit_of_measurement: "min"
        state: >
          {% if is_state('binary_sensor.hp_g12_tania_strefa', 'on') %}0{% else %}
          {% set s = states('input_text.hp_g12_strefy') %}
          {% if s in ['', 'unknown', 'unavailable'] %}{% set s = '22:00-06:00,13:00-15:00' %}{% endif %}
          {% set m = now().hour * 60 + now().minute %}
          {% set ns = namespace(d = 9999) %}
          {% for z in s.split(',') %}{% set p = z.strip().split('-') %}{% if p | count == 2 and ':' in p[0] %}
          {% set a = (p[0].split(':')[0] | int(0)) * 60 + (p[0].split(':')[1] | int(0)) %}
          {% set ns.d = [ns.d, (a - m) % 1440] | min %}
          {% endif %}{% endfor %}
          {% if is_state('input_boolean.hp_g12_weekend_tani', 'on') and now().weekday() < 5 %}{% set ns.d = [ns.d, (5 - now().weekday()) * 1440 - m] | min %}{% endif %}
          {{ ns.d }}{% endif %}
      # v1.22: wersja pakietu - karta sprawdza, czy w HA jest aktualny pakiet
      - name: "HP pakiet wersja"
        unique_id: hp_pakiet_wersja
        icon: mdi:package-variant
        state: "1.40"
      # v1.15: temperatura zewnetrzna z czujnika pompy (BT1) do historii nauki krzywej.
      # state_class: measurement => HA trzyma godzinowe statystyki dlugoterminowo (nie kasuje po 10 dniach).
      - name: "HP temperatura zewnetrzna BT1"
        unique_id: hp_temperatura_zewnetrzna_bt1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ has_value('sensor.hydrolution_temperatura_zewnetrzna_bt1') }}"
        state: "{{ states('sensor.hydrolution_temperatura_zewnetrzna_bt1') | float(0) | round(1) }}"
      # Moc grzewcza: z przeplywu BF1 i dT (BT12-BT3); gdy brak przeplywu -> 44706 z ESP (calkowite kW)
      - name: "HP moc grzewcza"
        unique_id: hp_moc_grzewcza
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set f = states('sensor.hydrolution_przeplyw_bf1') | float(0) %}
          {% set dt = states('sensor.hydrolution_zasilanie_z_pompy_bt12') | float(0)
                    - states('sensor.hydrolution_powrot_do_pompy_bt3') | float(0) %}
          {% if f > 1 and dt > 0 %}
            {{ (f / 60 * 4.186 * dt) | round(2) }}
          {% else %}
            {{ states('sensor.hydrolution_moc_grzewcza_szacowana') | float(0) }}
          {% endif %}

      # Moc elektryczna (SZACUNEK): prad jedn. zewn. (44866) x 230 V + grzalka
      - name: "HP moc elektryczna"
        unique_id: hp_moc_elektryczna
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.hydrolution_prad_jednostki_zewn') | float(0) * 230 / 1000
              + states('sensor.hydrolution_grzalka_moc') | float(0)) | round(2) }}

      # v1.36: historia planu i pracy (0 / 100 %). state_class: measurement => HA trzyma godzinowe statystyki
      #        dlugoterminowo (nie kasuje po 10 dniach). Karta: ostatnie ~10 dni z historii, starsze godzinowo ze statystyk.
      - name: "HP hist CWU plan"
        unique_id: hp_hist_cwu_plan
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-boiler
        state: >
          {{ 100 if is_state('schedule.hp_plan_tryb_cwu', 'on') and (is_state('input_boolean.hp_plan_cwu', 'on') or is_state('input_boolean.hp_auto_cwu', 'on'))
             or (is_state('input_boolean.hp_auto_cwu', 'on') and is_state('binary_sensor.hp_g12_tania_strefa', 'on')) else 0 }}
      - name: "HP hist CWU praca"
        unique_id: hp_hist_cwu_praca
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-boiler
        state: "{{ 100 if is_state('binary_sensor.hp_sprezarka_cwu', 'on') else 0 }}"
      - name: "HP hist cyrkulacja plan"
        unique_id: hp_hist_cyrkulacja_plan
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:autorenew
        state: >
          {%- set pl = states('input_text.hp_cyrk_plan') -%}
          {%- if is_state('input_boolean.hp_auto_cyrk', 'on') and pl | length == 168 -%}
          {%- set q = now().weekday() * 96 + now().hour * 4 + now().minute // 15 -%}
          {%- set c = '0123456789abcdef'.find(pl[q // 4]) -%}
          {{ 100 if c >= 0 and (c // (2 ** (3 - q % 4))) % 2 == 1 else 0 }}
          {%- else -%}
          {{ 100 if is_state('schedule.hp_plan_cyrkulacja_cwu', 'on') and is_state('input_boolean.hp_plan_cyrk', 'on') else 0 }}
          {%- endif -%}
      # pompa cyrkulacji nie ma czujnika pracy: "praca" = sterownik ma ja wlaczona (czas pracy > 1 min)
      - name: "HP hist cyrkulacja praca"
        unique_id: hp_hist_cyrkulacja_praca
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:autorenew
        state: "{{ 100 if states('number.hydrolution_cyrkulacja_cwu_czas_pracy') | float(0) > 1 else 0 }}"
      - name: "HP hist grzalka plan"
        unique_id: hp_hist_grzalka_plan
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:flash
        state: "{{ 100 if is_state('schedule.hp_plan_grzalka', 'on') and is_state('input_boolean.hp_plan_grz', 'on') else 0 }}"
      - name: "HP hist grzalka praca"
        unique_id: hp_hist_grzalka_praca
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:flash
        state: "{{ 100 if states('sensor.hydrolution_grzalka_moc') | float(0) > 0.05 else 0 }}"
      - name: "HP hist podgrzanie plan"
        unique_id: hp_hist_podgrzanie_plan
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-thermometer
        state: "{{ 100 if is_state('schedule.hp_plan_podgrzanie_cwu', 'on') and is_state('input_boolean.hp_plan_boost', 'on') else 0 }}"
      - name: "HP hist podgrzanie praca"
        unique_id: hp_hist_podgrzanie_praca
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-thermometer
        state: >
          {{ 100 if states('select.hydrolution_podgrzanie_cwu_jednorazowe') not in ['Wylaczone', 'unknown', 'unavailable']
             and (is_state('binary_sensor.hp_sprezarka_cwu', 'on') or states('sensor.hydrolution_grzalka_moc') | float(0) > 0.05) else 0 }}
      - name: "HP hist sprezarka"
        unique_id: hp_hist_sprezarka
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:heat-pump
        state: "{{ 100 if is_state('binary_sensor.hydrolution_sprezarka_pracuje', 'on') else 0 }}"

      - name: "HP COP chwilowy"
        unique_id: hp_cop_chwilowy
        state_class: measurement
        availability: "{{ states('sensor.hp_moc_elektryczna') | float(0) > 0.15 }}"
        state: >
          {{ (states('sensor.hp_moc_grzewcza') | float(0)
              / states('sensor.hp_moc_elektryczna') | float(1)) | round(2) }}

      # v1.37: liczniki ciepla z pompy (rejestry 44306/44308) na SMO40 stoja na 0 -> gdy licznik nic nie nabil,
      #        a calka z mocy grzewczej tak, bierzemy calke (sensor.hp_cieplo_calka_dzis).
      - name: "HP cieplo dzis"
        unique_id: hp_cieplo_dzis
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {% set m = states('sensor.hp_cieplo_co_dzis') | float(0) + states('sensor.hp_cieplo_cwu_dzis') | float(0) %}
          {% set c = states('sensor.hp_cieplo_calka_dzis') | float(0) %}
          {{ (m if m > 0.05 or c < 0.3 else c) | round(1) }}
      - name: "HP cieplo CWU dzis razem"
        unique_id: hp_cieplo_cwu_dzis_razem
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {% set m = states('sensor.hp_cieplo_cwu_dzis') | float(0) %}
          {% set c = states('sensor.hp_cieplo_cwu_calka_dzis') | float(0) %}
          {{ (m if m > 0.05 or c < 0.3 else c) | round(1) }}
      # v1.37: moc grzewcza tylko podczas grzania CWU (do calki "ciepla CWU")
      - name: "HP moc grzewcza CWU"
        unique_id: hp_moc_grzewcza_cwu
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.hp_moc_grzewcza') | float(0) if is_state('binary_sensor.hp_sprezarka_cwu', 'on') else 0 }}"
      # v1.37: moc elektryczna z encji wybranej w Nauce (input_text.hp_energia_encja, W albo kW), bez wyboru / licznik kWh = szacunek pakietu
      - name: "HP moc elektryczna wybrana"
        unique_id: hp_moc_elektryczna_wybrana
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set e = states('input_text.hp_energia_encja') %}
          {% set u = state_attr(e, 'unit_of_measurement') if e.startswith('sensor.') else none %}
          {% if u == 'W' and has_value(e) %}{{ (states(e) | float(0) / 1000) | round(3) }}
          {% elif u == 'kW' and has_value(e) %}{{ states(e) | float(0) | round(3) }}
          {% else %}{{ states('sensor.hp_moc_elektryczna') | float(0) | round(3) }}{% endif %}
      # v1.37: prad dzis (kWh): licznik kWh wybrany w Nauce (od polnocy) albo calka z mocy elektrycznej
      # v1.38: licznik z input_text.hp_energia_kwh_encja (zgodnosc: licznik kWh zapisany w hp_energia_encja)
      - name: "HP prad dzis"
        unique_id: hp_prad_dzis
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {% set k = states('input_text.hp_energia_kwh_encja') %}
          {% set e = k if k.startswith('sensor.') and state_attr(k, 'unit_of_measurement') in ['kWh', 'Wh'] else states('input_text.hp_energia_encja') %}
          {% set u = state_attr(e, 'unit_of_measurement') if e.startswith('sensor.') else none %}
          {% set b = states('input_number.hp_prad_licznik_polnoc') | float(-1) %}
          {% if u in ['kWh', 'Wh'] and has_value(e) and b >= 0 %}
          {{ ([0, states(e) | float(0) - b] | max * (0.001 if u == 'Wh' else 1)) | round(2) }}
          {% else %}{{ states('sensor.hp_prad_calka_dzis') | float(0) | round(2) }}{% endif %}

      - name: "HP cieplo miesiac"
        unique_id: hp_cieplo_miesiac
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {{ (states('sensor.hp_cieplo_co_miesiac') | float(0)
              + states('sensor.hp_cieplo_cwu_miesiac') | float(0)) | round(1) }}

      # Podswietlenie przyciskow "Tryb systemu" na karcie
      - name: "HP tryb systemu"
        unique_id: hp_tryb_systemu
        icon: mdi:cog-transfer
        state: >
          {% if is_state('switch.hydrolution_tryb_urlopowy', 'on') %}Urlop
          {% elif is_state('select.hydrolution_tryb_pracy', 'Auto') %}Auto
          {% elif is_state('switch.hydrolution_ogrzewanie_dozwolone', 'on') %}CO
          {% else %}CWU{% endif %}

      - name: "HP antylegionella za dni"
        unique_id: hp_antylegionella_za_dni
        unit_of_measurement: "d"
        availability: "{{ has_value('sensor.hp_antylegionella_ostatnio') }}"
        state: >
          {% set last = as_datetime(states('sensor.hp_antylegionella_ostatnio')) %}
          {% set co_ile = states('number.hydrolution_antylegionella_co_ile_dni') | int(0) %}
          {{ [0, co_ile - (now() - last).days] | max }}

  - binary_sensor:
      - name: "HP sprezarka CO"
        unique_id: hp_sprezarka_co
        device_class: running
        state: >
          {{ is_state('binary_sensor.hydrolution_sprezarka_pracuje', 'on')
             and is_state('sensor.hydrolution_priorytet_pracy', 'Ogrzewanie') }}
      - name: "HP sprezarka CWU"
        unique_id: hp_sprezarka_cwu
        device_class: running
        state: >
          {{ is_state('binary_sensor.hydrolution_sprezarka_pracuje', 'on')
             and is_state('sensor.hydrolution_priorytet_pracy', 'CWU') }}

  # Ostatnie przegrzanie antylegionella: BT7 doszlo do temp. koncowej (-1 C)
  - triggers:
      - trigger: template
        value_template: >
          {{ states('sensor.hydrolution_cwu_gora_bt7') | float(0)
             >= states('number.hydrolution_antylegionella_temperatura_koncowa') | float(99) - 1 }}
    sensor:
      - name: "HP antylegionella ostatnio"
        unique_id: hp_antylegionella_ostatnio
        device_class: timestamp
        state: "{{ now().isoformat() }}"

utility_meter:
  hp_cieplo_co_dzis:
    name: "HP cieplo CO dzis"
    source: sensor.hydrolution_licznik_ciepla_co
    cycle: daily
  hp_cieplo_cwu_dzis:
    name: "HP cieplo CWU dzis"
    source: sensor.hydrolution_licznik_ciepla_cwu
    cycle: daily
  hp_cieplo_co_miesiac:
    name: "HP cieplo CO miesiac"
    source: sensor.hydrolution_licznik_ciepla_co
    cycle: monthly
  hp_cieplo_cwu_miesiac:
    name: "HP cieplo CWU miesiac"
    source: sensor.hydrolution_licznik_ciepla_cwu
    cycle: monthly
  hp_starty_dzis:
    name: "HP starty dzis"
    source: sensor.hydrolution_sprezarka_liczba_startow
    cycle: daily
  # v1.37: dzienne z calek mocy (zamiast stojacych licznikow ciepla z pompy)
  hp_cieplo_calka_dzis:
    name: "HP cieplo calka dzis"
    source: sensor.hp_cieplo_calka
    cycle: daily
  hp_cieplo_cwu_calka_dzis:
    name: "HP cieplo CWU calka dzis"
    source: sensor.hp_cieplo_cwu_calka
    cycle: daily
  hp_prad_calka_dzis:
    name: "HP prad calka dzis"
    source: sensor.hp_prad_calka
    cycle: daily

sensor:
  - platform: history_stats
    name: "HP czas pracy dzis"
    unique_id: hp_czas_pracy_dzis
    entity_id: binary_sensor.hydrolution_sprezarka_pracuje
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "HP czas pracy CO dzis"
    unique_id: hp_czas_pracy_co_dzis
    entity_id: binary_sensor.hp_sprezarka_co
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "HP czas pracy CWU dzis"
    unique_id: hp_czas_pracy_cwu_dzis
    entity_id: binary_sensor.hp_sprezarka_cwu
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  # v1.37: calki mocy -> energia kWh (cieplo z mocy grzewczej, prad z mocy elektrycznej wybranej w Nauce)
  - platform: integration
    name: "HP cieplo calka"
    unique_id: hp_cieplo_calka
    source: sensor.hp_moc_grzewcza
    method: left
    unit_time: h
    round: 3
    max_sub_interval: {minutes: 5}
  - platform: integration
    name: "HP cieplo CWU calka"
    unique_id: hp_cieplo_cwu_calka
    source: sensor.hp_moc_grzewcza_cwu
    method: left
    unit_time: h
    round: 3
    max_sub_interval: {minutes: 5}
  - platform: integration
    name: "HP prad calka"
    unique_id: hp_prad_calka
    source: sensor.hp_moc_elektryczna_wybrana
    method: left
    unit_time: h
    round: 3
    max_sub_interval: {minutes: 5}
  # v1.21: tempo zmiany temp. srodka zasobnika CWU (BT6), °C/min - szybki spadek = ktos odkrecil ciepla wode
  - platform: derivative
    name: "HP CWU srodek zmiana"
    unique_id: hp_cwu_srodek_zmiana
    source: sensor.hydrolution_cwu_srodek_bt6
    unit_time: min
    time_window: "00:03:00"
    round: 3

# Przyciski "Tryb systemu" (moja interpretacja, sprawdz na sterowniku):
#   Auto  = tryb pracy Auto, urlop wyl.
#   CO    = tryb Reczny + ogrzewanie dozwolone, urlop wyl.
#   CWU   = tryb Reczny + ogrzewanie zablokowane (zostaje tylko CWU), urlop wyl.
#   Urlop = tryb urlopowy wl.
script:
  hp_tryb_auto:
    alias: "HP tryb Auto"
    icon: mdi:alpha-a-circle-outline
    sequence:
      - action: switch.turn_off
        target: {entity_id: switch.hydrolution_tryb_urlopowy}
      - action: select.select_option
        target: {entity_id: select.hydrolution_tryb_pracy}
        data: {option: "Auto"}
      # v1.27: CO zawsze z powrotem dozwolone, koniec ewentualnego grzania CWU luksusem
      - action: switch.turn_on
        target: {entity_id: switch.hydrolution_ogrzewanie_dozwolone}
      - action: input_text.set_value
        target: {entity_id: input_text.hp_cwu_boost}
        data: {value: ""}
  hp_tryb_co:
    alias: "HP tryb CO"
    icon: mdi:thermometer-lines
    sequence:
      - action: switch.turn_off
        target: {entity_id: switch.hydrolution_tryb_urlopowy}
      - action: select.select_option
        target: {entity_id: select.hydrolution_tryb_pracy}
        data: {option: "Reczny"}
      - action: switch.turn_on
        target: {entity_id: switch.hydrolution_ogrzewanie_dozwolone}
      - action: input_text.set_value
        target: {entity_id: input_text.hp_cwu_boost}
        data: {value: ""}
  # v1.27: CWU = jednorazowe grzanie wody na luksus z wstrzymanym CO; automatyzacja hp_cwu_boost_koniec
  #        wraca do Auto (CO wl.), gdy woda sie zagrzeje, luksus sie skonczy albo minie hp_cwu_lux_max (domyslnie 60 min).
  #        (do v1.26: Reczny + CO wyl. NA STALE - to zostawialo pompe bez CO i bez CWU)
  hp_tryb_cwu:
    alias: "HP tryb CWU"
    icon: mdi:water-outline
    sequence:
      - action: switch.turn_off
        target: {entity_id: switch.hydrolution_tryb_urlopowy}
      - action: script.hp_cwu_boost_start
        data: {zrodlo: "przycisk"}
  # v1.27: start jednorazowego luksusu: podgrzanie CWU jednorazowe + Reczny + CO wyl. (cala moc na wode)
  hp_cwu_boost_start:
    alias: "HP CWU: start luksusu jednorazowego"
    icon: mdi:water-boiler-alert
    fields:
      zrodlo: {description: "auto / przycisk"}
    sequence:
      - action: select.select_option
        target: {entity_id: select.hydrolution_podgrzanie_cwu_jednorazowe}
        data: {option: "Jednorazowo"}
      - action: select.select_option
        target: {entity_id: select.hydrolution_tryb_pracy}
        data: {option: "Reczny"}
      - action: switch.turn_off
        target: {entity_id: switch.hydrolution_ogrzewanie_dozwolone}
      - action: input_text.set_value
        target: {entity_id: input_text.hp_cwu_boost}
        data: {value: "{{ zrodlo | default('przycisk') }}"}
  # v1.27: koniec luksusu: Auto + CO wl.; przerwij = wylacz tez podgrzanie jednorazowe (gdy woda jeszcze nie zagrzana)
  hp_cwu_boost_stop:
    alias: "HP CWU: koniec luksusu jednorazowego"
    icon: mdi:water-boiler-off
    fields:
      przerwij: {description: "true = wylacz tez podgrzanie jednorazowe"}
    sequence:
      - action: select.select_option
        target: {entity_id: select.hydrolution_tryb_pracy}
        data: {option: "Auto"}
      - action: switch.turn_on
        target: {entity_id: switch.hydrolution_ogrzewanie_dozwolone}
      - if:
          - condition: template
            value_template: "{{ przerwij | default(false) and not is_state('select.hydrolution_podgrzanie_cwu_jednorazowe', 'Wylaczone') }}"
        then:
          - action: select.select_option
            target: {entity_id: select.hydrolution_podgrzanie_cwu_jednorazowe}
            data: {option: "Wylaczone"}
      - action: input_text.set_value
        target: {entity_id: input_text.hp_cwu_boost}
        data: {value: ""}
  hp_tryb_urlop:
    alias: "HP tryb Urlop"
    icon: mdi:briefcase-outline
    sequence:
      - action: switch.turn_on
        target: {entity_id: switch.hydrolution_tryb_urlopowy}

# =====================================================================
# HARMONOGRAM TYGODNIOWY (blok "Harmonogram" pod mapa karty, od v1.11)
# Okna czasu trzymaja harmonogramy `schedule.hp_plan_*` (karta tworzy je przyciskiem
# "Utworz harmonogramy" albo recznie: Ustawienia -> Urzadzenia i uslugi -> Pomocnicy).
# Kazda funkcja dziala dopiero po wlaczeniu jej przelacznika input_boolean.hp_plan_*.
# Wartosci ponizej bez `initial`, zeby HA zapamietywal je po restarcie
# (karta ustawia domyslne przy pierwszym tworzeniu: -2 / 0 / Luksus / Normalny / 60 / 0).
# =====================================================================
input_boolean:
  hp_plan_noc:
    name: "HP plan: obnizenie CO aktywne"
    icon: mdi:weather-night
  hp_plan_cwu:
    name: "HP plan: tryb CWU wg godzin aktywny"
    icon: mdi:water-boiler
  hp_plan_cyrk:
    name: "HP plan: cyrkulacja CWU aktywna"
    icon: mdi:autorenew
  hp_plan_grz:
    name: "HP plan: grzalka wg godzin aktywna"
    icon: mdi:flash
  hp_plan_boost:
    name: "HP plan: podgrzanie CWU aktywne"
    icon: mdi:water-thermometer
  # v1.15: suwak "Automatyzacja cyrkulacji" w zakladce Nauka. Domyslnie wylaczony (bez `initial`).
  hp_auto_cyrk:
    name: "HP auto: cyrkulacja wg harmonogramu i obecnosci"
    icon: mdi:home-account
  # v1.23: suwak "Automatyzacja CWU" w zakladce Nauka (taryfa G12). Domyslnie wylaczony (bez `initial`).
  hp_auto_cwu:
    name: "HP auto: CWU wg taryfy G12"
    icon: mdi:water-boiler-auto
  # v1.23: G12 - sobota i niedziela cala doba tania (np. taryfa G12w). Domyslnie wylaczony.
  hp_g12_weekend_tani:
    name: "HP G12: weekend caly tani"
    icon: mdi:calendar-weekend
  # v1.31: automatyzacja CWU - w taniej strefie luksus jednorazowy z wstrzymanym CO (jak w v1.27). Domyslnie WYLACZONY (bez `initial`).
  hp_cwu_lux_tania:
    name: "HP auto: CWU luksus jednorazowy w taniej strefie"
    icon: mdi:water-boiler-alert

input_datetime:
  # v1.27: kiedy automatyzacja CWU ostatnio wlaczyla luksus jednorazowy (najwyzej raz na 1,5 h)
  hp_cwu_boost_ostatnio:
    name: "HP CWU: luksus jednorazowy ostatnio"
    has_date: true
    has_time: true
    icon: mdi:history
  # v1.18: kiedy w weekend wstaliscie (pierwsza aktywnosc rano), wpisuje automatyzacja hp_auto_wstali
  hp_wstalismy:
    name: "HP auto: weekend - wstalismy o"
    has_date: true
    has_time: true
    icon: mdi:alarm
  # v1.33: reczne wymuszenie cyrkulacji z karty (klik w pompke) - do kiedy. Wymuszenie ma pierwszenstwo przed automatyzacjami.
  hp_cyrk_wymus_do:
    name: "HP cyrkulacja: wymuszona do"
    has_date: true
    has_time: true
    icon: mdi:pump
  # v1.35: kiedy HA ostatnio przeliczyl plan cyrkulacji (automatyzacja hp_cyrk_przelicz, bez otwierania karty)
  hp_cyrk_plan_przeliczony:
    name: "HP cyrkulacja: plan przeliczony"
    has_date: true
    has_time: true
    icon: mdi:calendar-sync
  # v1.35: nauka po stronie HA - ostatnio wykryty sen / wstanie (raz na noc / dzien)
  hp_nauka_sen:
    name: "HP nauka: ostatnio sen"
    has_date: true
    has_time: true
    icon: mdi:sleep
  hp_nauka_wstanie:
    name: "HP nauka: ostatnio wstanie"
    has_date: true
    has_time: true
    icon: mdi:weather-sunset-up

input_number:
  # v1.27: maks. czas luksusu jednorazowego z wstrzymanym CO (Reczny), potem powrot do Auto. Karta wpisuje 60 przy pierwszym uruchomieniu.
  hp_cwu_lux_max:
    name: "HP CWU: maks. czas luksusu (CO wstrzymane)"
    min: 0
    max: 240
    step: 5
    mode: box
    unit_of_measurement: "min"
  # v1.23: automatyzacja CWU - gdy do taniej strefy zostalo mniej niz tyle minut, nie grzej (czekaj). Karta wpisuje 30 przy pierwszym uruchomieniu.
  hp_cwu_czekaj_min:
    name: "HP auto: CWU czekaj na tania strefe"
    min: 0
    max: 180
    step: 5
    mode: box
    unit_of_measurement: "min"
  # v1.33: na ile minut klik w pompke na karcie wymusza cyrkulacje (karta przy pierwszym uruchomieniu wpisuje 60)
  hp_cyrk_wymus_min:
    name: "HP cyrkulacja: wymuszenie z karty na"
    min: 15
    max: 240
    step: 15
    mode: box
    unit_of_measurement: "min"
  # v1.19: ustawiane z zakladki Nauka (karta przy pierwszym uruchomieniu wpisuje 5)
  hp_cyrk_po_wyjsciu:
    name: "HP auto: cyrkulacja off po wyjsciu wszystkich"
    min: 0
    max: 60
    step: 1
    mode: box
    unit_of_measurement: "min"
  hp_noc_przesuniecie:
    name: "HP plan: przesuniecie krzywej w oknie"
    min: -10
    max: 10
    step: 1
    mode: box
    unit_of_measurement: "°C"
  hp_dzien_przesuniecie:
    name: "HP plan: przesuniecie krzywej poza oknem"
    min: -10
    max: 10
    step: 1
    mode: box
    unit_of_measurement: "°C"
  hp_cyrk_praca:
    name: "HP plan: cyrkulacja w oknie - czas pracy"
    min: 1
    max: 60
    step: 1
    mode: box
    unit_of_measurement: "min"
  # v1.37: stan licznika pradu (wybranego w Nauce, kWh/Wh) o polnocy -> sensor.hp_prad_dzis; -1 = jeszcze nie zapisany
  hp_prad_licznik_polnoc:
    name: "HP prad: licznik o polnocy"
    min: -1
    max: 999999999
    step: 0.001
    mode: box
  # v1.35: postoj min. 1 min (sterownik nie przyjmuje 0)
  hp_cyrk_postoj:
    name: "HP plan: cyrkulacja w oknie - czas postoju"
    min: 1
    max: 60
    step: 1
    mode: box
    unit_of_measurement: "min"

input_text:
  # v1.27: trwa luksus jednorazowy z wstrzymanym CO: "" = nie, "auto" = z automatyzacji G12, "przycisk" = przycisk CWU
  hp_cwu_boost:
    name: "HP CWU: luksus jednorazowy trwa"
    max: 20
  # v1.23: tanie strefy G12, np. "22:00-06:00,13:00-15:00" (puste = te domyslne). Ustawiane z zakladki Nauka.
  hp_g12_strefy:
    name: "HP G12: tanie strefy"
    max: 100
  # v1.21: ktory sygnal wykryl weekendowe wstanie: aktywnosc / woda
  hp_wstalismy_zrodlo:
    name: "HP auto: weekend - sygnal wstania"
    max: 20
  # v1.35: model cyrkulacji z Nauki, wpisuje karta (z historii) i automatyzacja hp_cyrk_nauka (sen / wstanie):
  #        "1;przed;wstanie_pn_pt;wstanie_so_nd;okno_od_wstania(1/0);recznie_pn_pt;recznie_so_nd;sen_pn,..,sen_nd"
  #        minuty od polnocy, sen > 1440 = po polnocy (np. 1470 = 0:30 nastepnego dnia)
  hp_cyrk_model:
    name: "HP cyrkulacja: model z Nauki"
    max: 255
  # v1.35: okna z obecnosci telefonow (albo reczne poprawki z Nauki), 7 dni x 96 kwadransow hex (Pn..Nd)
  hp_cyrk_obecnosc:
    name: "HP cyrkulacja: okna z obecnosci"
    max: 255
  # v1.35: plan cyrkulacji policzony w HA (hex jak wyzej). Przy wlaczonej automatyzacji cyrkulacji steruje nim hp_auto_cyrk i idzie do ESP.
  hp_cyrk_plan:
    name: "HP cyrkulacja: plan (HA)"
    max: 255
  # v1.39: automatyczny plan CWU z Nauki (karta wpisuje, hex 7 x 96 kwadransow) - od razu idzie do ESP (hp_esp_plan)
  hp_cwu_plan:
    name: "HP CWU: plan (z Nauki)"
    max: 255
  # v1.39: wynik ostatniego sprawdzenia planu w ESP (hp_esp_plan): "OK" albo "brak: ..." / "ESP offline"
  hp_esp_plan_status:
    name: "HP plan: stan w ESP"
    max: 255
  # v1.35: dwie pamieci krzywej grzewczej z Nauki (P1..P7 po przecinku, np. "40,30,29,28,25,18,5").
  #        Do pompy ida dopiero po "Wyslij na glowna" + potwierdzeniu w karcie. Fabryczna jest w kodzie karty (nie do zmiany).
  hp_krzywa_wzorcowa:
    name: "HP krzywa: wzorcowa"
    max: 100
  hp_krzywa_robocza:
    name: "HP krzywa: robocza"
    max: 100
  # v1.36: encja pradu wybrana w Nauce (moc W/kW albo energia kWh); puste = kafel "Prad" na glownej ukryty
  hp_energia_encja:
    name: "HP energia: encja pradu"
    max: 100
  # v1.38: licznik energii elektrycznej (kWh/Wh, narastajacy) wybrany w Nauce; hp_energia_encja = moc (W/kW)
  hp_energia_kwh_encja:
    name: "HP energia: licznik pradu kWh"
    max: 100

input_select:
  hp_cwu_tryb_w_oknie:
    name: "HP plan: tryb CWU w oknie"
    options: [Ekonomiczny, Normalny, Luksus, Smart]
  hp_cwu_tryb_poza:
    name: "HP plan: tryb CWU poza oknem"
    options: [Ekonomiczny, Normalny, Luksus, Smart]
  # v1.31: automatyzacja CWU - tryb CWU w taniej strefie (wybor w zakladce Nauka). Domyslnie Ekonomiczny (pierwsza opcja).
  #        W drogiej strefie automatyzacja bierze hp_cwu_tryb_poza (domyslnie Normalny).
  hp_cwu_tryb_tania:
    name: "HP auto: tryb CWU w taniej strefie"
    options: [Ekonomiczny, Normalny, Luksus, Smart]

automation:
  # 1) Obnizenie CO: w oknie przesuniecie krzywej = "w oknie", poza oknem = "poza oknem"
  - id: hp_plan_noc
    alias: "HP plan: obnizenie CO"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [schedule.hp_plan_obnizenie_co, input_number.hp_noc_przesuniecie, input_number.hp_dzien_przesuniecie, input_boolean.hp_plan_noc]
      - trigger: state
        entity_id: number.hydrolution_przesuniecie_krzywej_grzewczej
        from: unavailable
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hp_plan_noc
        state: "on"
      - condition: template
        value_template: "{{ has_value('number.hydrolution_przesuniecie_krzywej_grzewczej') and has_value('input_number.hp_noc_przesuniecie') and has_value('input_number.hp_dzien_przesuniecie') }}"
    actions:
      - variables:
          target: "{{ states('input_number.hp_noc_przesuniecie') | float(0) if is_state('schedule.hp_plan_obnizenie_co', 'on') else states('input_number.hp_dzien_przesuniecie') | float(0) }}"
      - condition: template
        value_template: "{{ (states('number.hydrolution_przesuniecie_krzywej_grzewczej') | float(0)) != target }}"
      - action: number.set_value
        target: {entity_id: number.hydrolution_przesuniecie_krzywej_grzewczej}
        data: {value: "{{ target }}"}

  # 2) Tryb CWU wg godzin
  - id: hp_plan_cwu
    alias: "HP plan: tryb CWU wg godzin"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [schedule.hp_plan_tryb_cwu, input_select.hp_cwu_tryb_w_oknie, input_select.hp_cwu_tryb_poza, input_boolean.hp_plan_cwu, input_boolean.hp_auto_cwu]
      - trigger: state
        entity_id: select.hydrolution_tryb_cwu
        from: unavailable
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hp_plan_cwu
        state: "on"
      # v1.23: gdy wlaczona automatyzacja CWU (hp_auto_cwu), steruje ona, a ta czeka
      - condition: not
        conditions:
          - condition: state
            entity_id: input_boolean.hp_auto_cwu
            state: "on"
      - condition: template
        value_template: "{{ has_value('select.hydrolution_tryb_cwu') }}"
    actions:
      - variables:
          target: "{{ states('input_select.hp_cwu_tryb_w_oknie') if is_state('schedule.hp_plan_tryb_cwu', 'on') else states('input_select.hp_cwu_tryb_poza') }}"
      - condition: template
        value_template: "{{ states('select.hydrolution_tryb_cwu') != target }}"
      - action: select.select_option
        target: {entity_id: select.hydrolution_tryb_cwu}
        data: {option: "{{ target }}"}

  # 2b) v1.23 Automatyzacja CWU (suwak w zakladce Nauka), taryfa G12:
  #     v1.31: w oknie (tania strefa) tryb CWU = hp_cwu_tryb_tania (domyslnie Ekonomiczny), w drogiej = hp_cwu_tryb_poza
  #     (domyslnie Normalny), gdy do taniej <= hp_cwu_czekaj_min -> Ekonomiczny (czeka).
  #     Luksus jednorazowy z v1.27 tylko przy wlaczonym input_boolean.hp_cwu_lux_tania (domyslnie WYLACZONY):
  #     w oknie, gdy BT7 < cel Luksusu - 2 °C: luksus jednorazowy + Reczny + CO wyl. (script.hp_cwu_boost_start), koniec w hp_cwu_boost_koniec.
  #     (v1.27-v1.30: tryb CWU zawsze "poza oknem" + luksus jednorazowy zawsze)
  #     (do v1.26: w oknie harmonogramu "Tryb CWU" (okna = tanie strefy z Nauki) -> tryb "w oknie" (domyslnie Luksus, nagrzewa w taniej),
  #     poza oknem -> tryb "poza oknem" (domyslnie Normalny: pompa dogrzeje dopiero, gdy woda spadnie ponizej progu Normalnego),
  #     ale gdy do okna zostalo mniej niz hp_cwu_czekaj_min (30 min) -> Ekonomiczny (czeka na tania strefe).
  #     Pusty harmonogram -> okna = binary_sensor.hp_g12_tania_strefa. Dziala tylko przy hp_auto_cwu = on.
  - id: hp_auto_cwu
    alias: "HP auto: CWU wg taryfy G12"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [input_boolean.hp_auto_cwu, schedule.hp_plan_tryb_cwu, binary_sensor.hp_g12_tania_strefa, input_number.hp_cwu_czekaj_min, input_select.hp_cwu_tryb_w_oknie, input_select.hp_cwu_tryb_poza, input_select.hp_cwu_tryb_tania, input_boolean.hp_cwu_lux_tania]
      - trigger: state
        entity_id: select.hydrolution_tryb_cwu
        from: unavailable
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hp_auto_cwu
        state: "on"
      - condition: template
        value_template: "{{ has_value('select.hydrolution_tryb_cwu') }}"
    actions:
      - variables:
          ne: "{{ state_attr('schedule.hp_plan_tryb_cwu', 'next_event') }}"
          ma_plan: "{{ ne is not none and ne != '' and states('schedule.hp_plan_tryb_cwu') in ['on', 'off'] }}"
          # v1.39: okno tylko w taniej strefie G12 (stare okna harmonogramu nie przedluza trybu taniej na droga); okna z Nauki moga tania pominac
          okno: "{{ is_state('binary_sensor.hp_g12_tania_strefa', 'on') and (is_state('schedule.hp_plan_tryb_cwu', 'on') if ma_plan else true) }}"
          do_okna: >
            {% if okno %}0
            {% else %}{{ states('sensor.hp_g12_do_taniej') | float(9999) }}{% endif %}
          czekaj: "{{ states('input_number.hp_cwu_czekaj_min') | float(30) }}"
          w_oknie: "{{ states('input_select.hp_cwu_tryb_w_oknie') if states('input_select.hp_cwu_tryb_w_oknie') not in ['unknown', 'unavailable', ''] else 'Luksus' }}"
          poza: "{{ states('input_select.hp_cwu_tryb_poza') if states('input_select.hp_cwu_tryb_poza') not in ['unknown', 'unavailable', ''] else 'Normalny' }}"
          tania: "{{ states('input_select.hp_cwu_tryb_tania') if states('input_select.hp_cwu_tryb_tania') not in ['unknown', 'unavailable', ''] else 'Ekonomiczny' }}"
          target: "{{ tania if okno else ('Ekonomiczny' if (do_okna | float(9999)) <= czekaj else poza) }}"
          bt7: "{{ states('sensor.hydrolution_cwu_gora_bt7') | float(99) }}"
          cel: "{{ states('number.hydrolution_cwu_temp_stop_luksus') | float(53) }}"
          boost: "{{ states('input_text.hp_cwu_boost') not in ['', 'unknown', 'unavailable'] }}"
          ost: "{{ states('input_datetime.hp_cwu_boost_ostatnio') | as_datetime(none) }}"
          moze: "{{ ost is none or (now() - (ost | as_local)).total_seconds() > 5400 }}"
      - if:
          - condition: template
            value_template: "{{ states('select.hydrolution_tryb_cwu') != target }}"
        then:
          - action: select.select_option
            target: {entity_id: select.hydrolution_tryb_cwu}
            data: {option: "{{ target }}"}
      # v1.27: tania strefa i woda ponizej celu Luksusu -> luksus jednorazowy z wstrzymanym CO (najwyzej raz na 1,5 h)
      #        v1.31: tylko gdy wlaczony input_boolean.hp_cwu_lux_tania
      - if:
          - condition: template
            value_template: "{{ okno and is_state('input_boolean.hp_cwu_lux_tania', 'on') and not boost and moze and bt7 < cel - 2 and has_value('select.hydrolution_podgrzanie_cwu_jednorazowe') and has_value('select.hydrolution_tryb_pracy') }}"
        then:
          - action: input_datetime.set_datetime
            target: {entity_id: input_datetime.hp_cwu_boost_ostatnio}
            data: {datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"}
          - action: script.hp_cwu_boost_start
            data: {zrodlo: "auto"}

  # 2c) v1.27 Koniec luksusu jednorazowego (dziala zawsze, tez bez automatyzacji CWU): wraca do Auto i CO wl., gdy
  #     woda zagrzana (BT7 >= cel Luksusu - 0,5), luksus sie skonczyl, minal hp_cwu_lux_max (60 min), restart HA,
  #     a dla startu z automatyzacji tez: koniec taniej strefy, wylaczenie automatyzacji CWU albo (v1.31) wylaczenie luksusu w taniej. CO nie zostaje wylaczone na stale.
  - id: hp_cwu_boost_koniec
    alias: "HP CWU: koniec luksusu jednorazowego"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: [sensor.hydrolution_cwu_gora_bt7, select.hydrolution_podgrzanie_cwu_jednorazowe, input_boolean.hp_auto_cwu, binary_sensor.hp_g12_tania_strefa, schedule.hp_plan_tryb_cwu, input_boolean.hp_cwu_lux_tania]
      - trigger: homeassistant
        event: start
        id: start
    conditions:
      - condition: template
        value_template: "{{ states('input_text.hp_cwu_boost') not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - variables:
          zr: "{{ states('input_text.hp_cwu_boost') }}"
          min_trwa: "{{ ((now() - states.input_text.hp_cwu_boost.last_changed).total_seconds() / 60) | round(0) }}"
          maks: "{{ states('input_number.hp_cwu_lux_max') | float(60) if states('input_number.hp_cwu_lux_max') | float(0) > 0 else 60 }}"
          bt7: "{{ states('sensor.hydrolution_cwu_gora_bt7') | float(0) }}"
          cel: "{{ states('number.hydrolution_cwu_temp_stop_luksus') | float(53) }}"
          ma_plan: "{{ state_attr('schedule.hp_plan_tryb_cwu', 'next_event') not in [none, ''] }}"
          # v1.39: okno tylko w taniej strefie G12 (stare okna harmonogramu nie przedluza trybu taniej na droga); okna z Nauki moga tania pominac
          okno: "{{ is_state('binary_sensor.hp_g12_tania_strefa', 'on') and (is_state('schedule.hp_plan_tryb_cwu', 'on') if ma_plan else true) }}"
          zagrzana: "{{ bt7 >= cel - 0.5 }}"
          lux_koniec: "{{ is_state('select.hydrolution_podgrzanie_cwu_jednorazowe', 'Wylaczone') and min_trwa >= 5 }}"
          przerwij: >
            {{ trigger.id == 'start' or min_trwa >= maks
               or (zr == 'auto' and (not okno or is_state('input_boolean.hp_auto_cwu', 'off') or is_state('input_boolean.hp_cwu_lux_tania', 'off'))) }}
      - condition: template
        value_template: "{{ zagrzana or lux_koniec or przerwij }}"
      - action: script.hp_cwu_boost_stop
        data:
          przerwij: "{{ przerwij and not zagrzana }}"

  # 3) Cyrkulacja CWU: w oknie czasy "w oknie", poza oknem praca 1 min / postoj 60 min (SMO40 nie ma wl/wyl)
  - id: hp_plan_cyrk
    alias: "HP plan: cyrkulacja CWU"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [schedule.hp_plan_cyrkulacja_cwu, input_number.hp_cyrk_praca, input_number.hp_cyrk_postoj, input_boolean.hp_plan_cyrk, input_boolean.hp_auto_cyrk]
      - trigger: state
        entity_id: input_datetime.hp_cyrk_wymus_do
      - trigger: time
        at: input_datetime.hp_cyrk_wymus_do
      - trigger: state
        entity_id: number.hydrolution_cyrkulacja_cwu_czas_pracy
        from: unavailable
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hp_plan_cyrk
        state: "on"
      # v1.15: gdy wlaczona automatyzacja cyrkulacji (hp_auto_cyrk), steruje ona, a ta czeka
      - condition: not
        conditions:
          - condition: state
            entity_id: input_boolean.hp_auto_cyrk
            state: "on"
      - condition: template
        value_template: "{{ has_value('number.hydrolution_cyrkulacja_cwu_czas_pracy') and has_value('number.hydrolution_cyrkulacja_cwu_czas_postoju') }}"
      # v1.33: reczne wymuszenie z karty ma pierwszenstwo
      - condition: template
        value_template: "{{ (state_attr('input_datetime.hp_cyrk_wymus_do', 'timestamp') | float(0)) <= now().timestamp() }}"
    actions:
      - variables:
          w_oknie: "{{ is_state('schedule.hp_plan_cyrkulacja_cwu', 'on') }}"
          praca: "{{ states('input_number.hp_cyrk_praca') | float(60) if w_oknie else 1 }}"
          postoj: "{{ [1, states('input_number.hp_cyrk_postoj') | float(1)] | max if w_oknie else 60 }}"
      - condition: template
        value_template: "{{ (states('number.hydrolution_cyrkulacja_cwu_czas_pracy') | float(0)) != praca or (states('number.hydrolution_cyrkulacja_cwu_czas_postoju') | float(0)) != postoj }}"
      - action: number.set_value
        target: {entity_id: number.hydrolution_cyrkulacja_cwu_czas_pracy}
        data: {value: "{{ praca }}"}
      - action: number.set_value
        target: {entity_id: number.hydrolution_cyrkulacja_cwu_czas_postoju}
        data: {value: "{{ postoj }}"}

  # 3b) v1.15 Automatyzacja cyrkulacji (suwak w zakladce Nauka): harmonogram + obecnosc telefonow.
  #     Wszyscy poza domem (zone.home = 0 przez hp_cyrk_po_wyjsciu min, domyslnie 5) = wylaczona, ktos wrocil = od razu wg harmonogramu.
  #     Pora snu blokuje wlaczanie, bo okna harmonogramu z Nauki omijaja sen.
  #     "Wylaczona" = praca 1 min / postoj 60 min (SMO40 nie ma wl/wyl). Dziala tylko przy hp_auto_cyrk = on.
  - id: hp_auto_cyrk
    alias: "HP auto: cyrkulacja CWU wg harmonogramu i obecnosci"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [schedule.hp_plan_cyrkulacja_cwu, input_number.hp_cyrk_praca, input_number.hp_cyrk_postoj, input_boolean.hp_auto_cyrk, input_datetime.hp_wstalismy, input_number.hp_cyrk_po_wyjsciu, input_text.hp_cyrk_plan]
      - trigger: state
        entity_id: input_datetime.hp_cyrk_wymus_do
      - trigger: time
        at: input_datetime.hp_cyrk_wymus_do
      - trigger: state
        entity_id: zone.home
        to: "0"
        for: {minutes: "{{ states('input_number.hp_cyrk_po_wyjsciu') | int(5) }}"}
      - trigger: state
        entity_id: zone.home
        from: "0"
      - trigger: state
        entity_id: number.hydrolution_cyrkulacja_cwu_czas_pracy
        from: unavailable
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.hp_auto_cyrk
        state: "on"
      - condition: template
        value_template: "{{ has_value('number.hydrolution_cyrkulacja_cwu_czas_pracy') and has_value('number.hydrolution_cyrkulacja_cwu_czas_postoju') }}"
      # v1.33: reczne wymuszenie z karty ma pierwszenstwo (co 5 min go nie nadpisuje)
      - condition: template
        value_template: "{{ (state_attr('input_datetime.hp_cyrk_wymus_do', 'timestamp') | float(0)) <= now().timestamp() }}"
      # v1.39: zone.home nieznany (np. po restarcie) = nic nie zmieniaj (wczesniej liczylo sie jako pusty dom)
      - condition: template
        value_template: "{{ states('zone.home') | is_number }}"
    actions:
      - variables:
          ktos: "{{ states('zone.home') | int(0) > 0 }}"
          pusto_dlugo: "{{ not ktos and (now() - states.zone.home.last_changed).total_seconds() >= (states('input_number.hp_cyrk_po_wyjsciu') | int(5)) * 60 }}"
          # v1.35: okno z planu policzonego w HA (input_text.hp_cyrk_plan, 168 znakow hex), bez planu jak dawniej z harmonogramu
          w_oknie: >-
            {%- set pl = states('input_text.hp_cyrk_plan') -%}
            {%- if pl | length == 168 -%}
            {%- set q = now().weekday() * 96 + now().hour * 4 + now().minute // 15 -%}
            {%- set c = '0123456789abcdef'.find(pl[q // 4]) -%}
            {{ c >= 0 and (c // (2 ** (3 - q % 4))) % 2 == 1 }}
            {%- else -%}
            {{ is_state('schedule.hp_plan_cyrkulacja_cwu', 'on') }}
            {%- endif -%}
          # v1.20: po wstaniu cyrkulacja chodzi caly czas, dopoki ktos jest w domu i nie spimy
          #        (okno w harmonogramie: od wstania do pory snu). Wylacza: wszyscy wyszli (po hp_cyrk_po_wyjsciu min) albo koniec okna (sen).
          # weekend: od pierwszej aktywnosci rano (input_datetime.hp_wstalismy) do poludnia, potem przejmuje okno z harmonogramu
          wst: "{{ states('input_datetime.hp_wstalismy') | as_datetime(none) }}"
          od_wst: "{{ (now() - (wst | as_local)).total_seconds() if wst is not none and (wst | as_local).date() == now().date() else -1 }}"
          rano: "{{ now().isoweekday() >= 6 and od_wst >= 0 and now().hour < 12 }}"
          wl: "{{ (w_oknie or rano) and not pusto_dlugo }}"
          praca: "{{ states('input_number.hp_cyrk_praca') | float(60) if wl else 1 }}"
          postoj: "{{ [1, states('input_number.hp_cyrk_postoj') | float(1)] | max if wl else 60 }}"
      - condition: template
        value_template: "{{ (states('number.hydrolution_cyrkulacja_cwu_czas_pracy') | float(0)) != praca or (states('number.hydrolution_cyrkulacja_cwu_czas_postoju') | float(0)) != postoj }}"
      - action: number.set_value
        target: {entity_id: number.hydrolution_cyrkulacja_cwu_czas_pracy}
        data: {value: "{{ praca }}"}
      - action: number.set_value
        target: {entity_id: number.hydrolution_cyrkulacja_cwu_czas_postoju}
        data: {value: "{{ postoj }}"}

  # 3a) v1.33 Reczne wymuszenie cyrkulacji z karty (klik w pompke): do input_datetime.hp_cyrk_wymus_do
  #     praca 60 min / postoj 1 (v1.35: min. postoj sterownika = 1 min; prawie caly czas). Automatyzacje 3) i 3b) w tym czasie nic nie zmieniaja.
  #     Koniec wymuszenia: przejmuje automatyzacja / plan, a gdy obie wylaczone - wylaczona (praca 1 / postoj 60).
  - id: hp_cyrk_wymus
    alias: "HP cyrkulacja: reczne wymuszenie z karty"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_datetime.hp_cyrk_wymus_do
        id: start
      - trigger: state
        entity_id: number.hydrolution_cyrkulacja_cwu_czas_pracy
        from: unavailable
        id: start
      - trigger: homeassistant
        event: start
        id: start
      - trigger: time
        at: input_datetime.hp_cyrk_wymus_do
        id: koniec
    conditions:
      - condition: template
        value_template: "{{ has_value('number.hydrolution_cyrkulacja_cwu_czas_pracy') and has_value('number.hydrolution_cyrkulacja_cwu_czas_postoju') }}"
    actions:
      - variables:
          aktywne: "{{ (state_attr('input_datetime.hp_cyrk_wymus_do', 'timestamp') | float(0)) > now().timestamp() }}"
          steruje: "{{ is_state('input_boolean.hp_auto_cyrk', 'on') or is_state('input_boolean.hp_plan_cyrk', 'on') }}"
          praca: "{{ 60 if aktywne else 1 }}"
          postoj: "{{ 1 if aktywne else 60 }}"
      - condition: template
        value_template: "{{ aktywne or (trigger.id == 'koniec' and not steruje) }}"
      - condition: template
        value_template: "{{ (states('number.hydrolution_cyrkulacja_cwu_czas_pracy') | float(0)) != praca or (states('number.hydrolution_cyrkulacja_cwu_czas_postoju') | float(0)) != postoj }}"
      - action: number.set_value
        target: {entity_id: number.hydrolution_cyrkulacja_cwu_czas_pracy}
        data: {value: "{{ praca }}"}
      - action: number.set_value
        target: {entity_id: number.hydrolution_cyrkulacja_cwu_czas_postoju}
        data: {value: "{{ postoj }}"}

  # 3f) v1.37 Prad dzis: o polnocy (i po zmianie encji w Nauce) zapamietaj stan licznika kWh
  #     v1.38: licznik z hp_energia_kwh_encja; po zmianie wyboru stan "o polnocy" = teraz - dzisiejsza calka mocy (bez czekania do polnocy)
  - id: hp_prad_polnoc
    alias: "HP energia: licznik pradu o polnocy"
    mode: queued
    triggers:
      - trigger: time
        at: "00:00:00"
      - trigger: state
        entity_id: [input_text.hp_energia_encja, input_text.hp_energia_kwh_encja]
    actions:
      - variables:
          k: "{{ states('input_text.hp_energia_kwh_encja') }}"
          e: "{{ k if k.startswith('sensor.') and state_attr(k, 'unit_of_measurement') in ['kWh', 'Wh'] else states('input_text.hp_energia_encja') }}"
          ok: "{{ e.startswith('sensor.') and state_attr(e, 'unit_of_measurement') in ['kWh', 'Wh'] and has_value(e) }}"
          f: "{{ 1000 if state_attr(e, 'unit_of_measurement') == 'Wh' else 1 }}"
      - action: input_number.set_value
        target: {entity_id: input_number.hp_prad_licznik_polnoc}
        data:
          value: >-
            {% if not ok %}-1{% elif trigger.platform == 'time' %}{{ states(e) | float(0) }}
            {% else %}{{ [0, states(e) | float(0) - states('sensor.hp_prad_calka_dzis') | float(0) * f] | max }}{% endif %}

  # 3d) v1.35 Plan cyrkulacji liczony w HA (bez otwierania karty). Dziala tylko przy hp_auto_cyrk = on.
  #     Z modelu (input_text.hp_cyrk_model: pora wstawania Pn-Pt / So-Nd, ile min przed, pora snu na kazdy dzien)
  #     i okien z obecnosci (input_text.hp_cyrk_obecnosc) liczy to samo co karta: okno od (wstanie - przed) do snu,
  #     sen po polnocy = okno 0:00-sen nastepnego dnia. Wynik -> input_text.hp_cyrk_plan (hex 7 x 96 kwadransow).
  #     Przelicza: zmiana modelu (karta / nauka snu i wstawania), zmiana okien z obecnosci, wlaczenie automatyzacji,
  #     raz na dobe (0:05) i po starcie HA. (v1.37: bez wyzwalacza zone.home - plan od niego nie zalezy;
  #     wyjscie / powrot telefonow obsluguje na biezaco hp_auto_cyrk.) Wpisuje tylko, gdy plan sie zmienil. Plan idzie dalej do ESP (hp_esp_plan).
  - id: hp_cyrk_przelicz
    alias: "HP auto: przelicz plan cyrkulacji (bez karty)"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [input_text.hp_cyrk_model, input_text.hp_cyrk_obecnosc]
      - trigger: state
        entity_id: input_boolean.hp_auto_cyrk
        to: "on"
      - trigger: time
        at: "00:05:00"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hp_auto_cyrk
        state: "on"
      - condition: template
        value_template: "{{ states('input_text.hp_cyrk_model').startswith('1;') and states('input_text.hp_cyrk_model').split(';') | count >= 8 }}"
    actions:
      - delay: {seconds: 3}
      - variables:
          plan: >-
            {%- set p = states('input_text.hp_cyrk_model').split(';') -%}
            {%- set pre = p[1] | int(20) -%}{%- set wd = p[2] | int(390) -%}{%- set we = p[3] | int(480) -%}{%- set on = p[4] == '1' -%}
            {%- set ss = p[7].split(',') -%}
            {%- set ob = states('input_text.hp_cyrk_obecnosc') -%}
            {%- set obok = ob | length == 168 -%}
            {%- set hx = '0123456789abcdef' -%}
            {%- set ns = namespace(h='') -%}
            {%- for d in range(7) -%}
            {%- set f = [0, (we if d >= 5 else wd) - pre] | max -%}
            {%- set s = ss[d] | int(1440) if ss | count == 7 else 1440 -%}
            {%- set t = [f + 15, [1440, s] | min] | max -%}
            {%- set sp = ss[(d + 6) % 7] | int(1440) if ss | count == 7 else 1440 -%}
            {%- set e = sp - 1440 if sp > 1440 else 0 -%}
            {%- for q in range(24) -%}
            {%- set nb = namespace(v=0) -%}
            {%- set c = [0, hx.find(ob[d * 24 + q])] | max if obok else 0 -%}
            {%- for i in range(4) -%}
            {%- set m = (q * 4 + i) * 15 -%}
            {%- if (c // (2 ** (3 - i))) % 2 == 1 or (on and ((m + 15 > f and m < t) or m < e)) -%}{%- set nb.v = nb.v + 2 ** (3 - i) -%}{%- endif -%}
            {%- endfor -%}
            {%- set ns.h = ns.h ~ hx[nb.v] -%}
            {%- endfor -%}
            {%- endfor -%}
            {{- ns.h -}}
      - condition: template
        value_template: "{{ plan | length == 168 }}"
      - if:
          - condition: template
            value_template: "{{ states('input_text.hp_cyrk_plan') != plan }}"
        then:
          - action: input_text.set_value
            target: {entity_id: input_text.hp_cyrk_plan}
            data: {value: "{{ plan }}"}
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.hp_cyrk_plan_przeliczony}
        data: {timestamp: "{{ now().timestamp() }}"}

  # 3e) v1.35 Nauka po stronie HA (gdy karta zamknieta): poprawia model po kazdej nocy.
  #     Sen = brak aktywnosci w domu (binary_sensor.hp_aktywnosc_w_domu) przez 30 min, 21:00-3:00, ktos w domu (raz na noc).
  #     Wstanie = aktywnosc trwajaca 10 min albo pobor cieplej wody 4:00-11:00 po wykrytym snie (raz na dzien).
  #     v1.37: sen dopiero od 21:00 (cichy wieczor przy TV to nie sen), wstanie dopiero po 10 min aktywnosci (nocne wstawanie to nie poranek).
  #     Nowa wartosc = 3/4 starej + 1/4 dzisiejszej (pory ustawione w Nauce recznie nie sa ruszane).
  #     Po otwarciu karty model nadpisuje Nauka z karty (liczona z calej historii). Dziala tylko przy hp_auto_cyrk = on.
  - id: hp_cyrk_nauka
    alias: "HP auto: nauka snu i wstawania (cyrkulacja, bez karty)"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hp_aktywnosc_w_domu
        to: "off"
        for: {minutes: 30}
        id: sen
      - trigger: state
        entity_id: binary_sensor.hp_aktywnosc_w_domu
        from: "off"
        to: "on"
        for: {minutes: 10}
        id: wstanie
      - trigger: numeric_state
        entity_id: sensor.hp_cwu_srodek_zmiana
        below: -0.06
        for: {seconds: 30}
        id: wstanie
    conditions:
      - condition: state
        entity_id: input_boolean.hp_auto_cyrk
        state: "on"
      - condition: template
        value_template: "{{ states('input_text.hp_cyrk_model').startswith('1;') and states('input_text.hp_cyrk_model').split(';') | count >= 8 and states('input_text.hp_cyrk_model').split(';')[7].split(',') | count == 7 }}"
      - condition: template
        value_template: "{{ states('zone.home') | int(0) > 0 }}"
      - condition: template
        value_template: >-
          {%- set sen = states('input_datetime.hp_nauka_sen') | as_datetime(none) -%}
          {%- set wst = states('input_datetime.hp_nauka_wstanie') | as_datetime(none) -%}
          {%- if trigger.id == 'sen' -%}
          {%- set o = now() - timedelta(minutes=30) -%}
          {{ (o.hour >= 21 or o.hour < 3) and (sen is none or (now() - (sen | as_local)).total_seconds() > 12 * 3600) }}
          {%- else -%}
          {{ 4 <= now().hour < 11 and sen is not none and (now() - (sen | as_local)).total_seconds() < 14 * 3600
             and (wst is none or (wst | as_local).date() != now().date()) }}
          {%- endif -%}
    actions:
      - variables:
          p: "{{ states('input_text.hp_cyrk_model').split(';') }}"
          nowy: >-
            {%- set ss = p[7].split(',') | map('int', 1440) | list -%}
            {%- if trigger.id == 'sen' -%}
            {%- set o = now() - timedelta(minutes=30) -%}
            {%- set m = o.hour * 60 + o.minute -%}
            {%- set d = o.weekday() if o.hour >= 12 else (o.weekday() + 6) % 7 -%}
            {%- set v = m if o.hour >= 12 else m + 1440 -%}
            {%- set nv = (((ss[d] * 3 + v) / 4 / 15) | round(0) * 15) | int -%}
            {%- set out = namespace(l=[]) -%}
            {%- for i in range(7) -%}{%- set out.l = out.l + [nv if i == d else ss[i]] -%}{%- endfor -%}
            {{ p[:7] | join(';') }};{{ out.l | join(',') }}
            {%- else -%}
            {%- set m = now().hour * 60 + now().minute -%}
            {%- set wkd = now().weekday() >= 5 -%}
            {%- set k = 3 if wkd else 2 -%}
            {%- set man = p[6] if wkd else p[5] -%}
            {%- if man == '1' -%}{{ p | join(';') }}{%- else -%}
            {%- set nv = (((p[k] | int(m)) * 3 + m) / 4 / 5) | round(0) * 5 -%}
            {%- set out = namespace(l=[]) -%}
            {%- for i in range(p | count) -%}{%- set out.l = out.l + [(nv | int) | string if i == k else p[i]] -%}{%- endfor -%}
            {{ out.l | join(';') }}
            {%- endif -%}
            {%- endif -%}
      - action: input_datetime.set_datetime
        target: {entity_id: "{{ 'input_datetime.hp_nauka_sen' if trigger.id == 'sen' else 'input_datetime.hp_nauka_wstanie' }}"}
        data: {timestamp: "{{ now().timestamp() }}"}
      - if:
          - condition: template
            value_template: "{{ nowy | length <= 255 and nowy != states('input_text.hp_cyrk_model') }}"
        then:
          - action: input_text.set_value
            target: {entity_id: input_text.hp_cyrk_model}
            data: {value: "{{ nowy }}"}

  # 3c) v1.18 Weekend: pierwsza aktywnosc rano (5:00-11:00, ktos w domu) = wstalismy -> cyrkulacja (v1.20: dopoki ktos w domu).
  #     v1.21: drugi sygnal = pobor cieplej wody (szybki spadek BT6 w zasobniku CWU), zapisuje zrodlo w input_text.hp_wstalismy_zrodlo.
  #     Raz na dzien. Dziala tylko przy wlaczonej automatyzacji cyrkulacji (hp_auto_cyrk).
  #     Bez sygnalu zostaje okno z harmonogramu (sugestia z Nauki, ok. 8:00).
  - id: hp_auto_wstali
    alias: "HP auto: weekend - wstalismy (cyrkulacja)"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hp_aktywnosc_w_domu
        from: "off"
        to: "on"
        id: aktywnosc
      # v1.21: pobor CWU = temperatura srodka zasobnika (BT6) spada szybciej niz 0,06 °C/min przez 30 s
      #        (straty postojowe to ok. 0,01 °C/min). BF1 to przeplyw obiegu pompy, nie kranu, wiec sie nie nadaje.
      - trigger: numeric_state
        entity_id: sensor.hp_cwu_srodek_zmiana
        below: -0.06
        for: {seconds: 30}
        id: woda
    conditions:
      - condition: state
        entity_id: input_boolean.hp_auto_cyrk
        state: "on"
      - condition: time
        after: "05:00:00"
        before: "11:00:00"
        weekday: [sat, sun]
      - condition: template
        value_template: "{{ states('zone.home') | int(0) > 0 }}"
      - condition: template
        value_template: "{{ (states('input_datetime.hp_wstalismy') | as_datetime(none)) is none or (states('input_datetime.hp_wstalismy') | as_datetime | as_local).date() != now().date() }}"
    actions:
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.hp_wstalismy}
        data: {datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"}
      - action: input_text.set_value
        target: {entity_id: input_text.hp_wstalismy_zrodlo}
        data: {value: "{{ trigger.id }}"}

  # 4) Grzalka dozwolona tylko w oknach
  - id: hp_plan_grz
    alias: "HP plan: grzalka wg godzin"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [schedule.hp_plan_grzalka, input_boolean.hp_plan_grz]
      - trigger: state
        entity_id: switch.hydrolution_grzalka_dozwolona
        from: unavailable
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hp_plan_grz
        state: "on"
      - condition: template
        value_template: "{{ has_value('switch.hydrolution_grzalka_dozwolona') }}"
    actions:
      - variables:
          target: "{{ 'on' if is_state('schedule.hp_plan_grzalka', 'on') else 'off' }}"
      - condition: template
        value_template: "{{ states('switch.hydrolution_grzalka_dozwolona') != target }}"
      - action: "switch.turn_{{ target }}"
        target: {entity_id: switch.hydrolution_grzalka_dozwolona}

  # 5) Jednorazowe podgrzanie CWU na poczatku kazdego okna
  - id: hp_plan_boost
    alias: "HP plan: podgrzanie CWU"
    mode: single
    triggers:
      - trigger: state
        entity_id: schedule.hp_plan_podgrzanie_cwu
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.hp_plan_boost
        state: "on"
      - condition: template
        value_template: "{{ has_value('select.hydrolution_podgrzanie_cwu_jednorazowe') }}"
    actions:
      - action: select.select_option
        target: {entity_id: select.hydrolution_podgrzanie_cwu_jednorazowe}
        data: {option: "Jednorazowo"}

  # 6) v1.34 Plan tygodnia do ESP (v5.5): ESP trzyma go we flashu i wykonuje sam, gdy HA nie odpowiada > 5 min.
  #    Maski 7 dni x 96 kwadransow (hex, Pn..Nd) dla: tryb CWU (okno), cyrkulacja, obnizenie CO, grzalka + parametry.
  #    Wysyla tylko, gdy cos sie zmienilo (oszczedza flash ESP). Bez ESP v5.5 (brak encji text.hydrolution_plan_offline_*) nic nie robi.
  #    Bez HA ESP nie zna obecnosci ani luksusu jednorazowego: cyrkulacja wg okien, CWU wg okien (G12 albo harmonogram).
  - id: hp_esp_plan
    alias: "HP plan: wyslij plan tygodnia do ESP"
    mode: restart
    triggers:
      - trigger: state
        entity_id: [input_boolean.hp_plan_cwu, input_boolean.hp_auto_cwu, input_boolean.hp_plan_cyrk, input_boolean.hp_auto_cyrk, input_boolean.hp_plan_noc, input_boolean.hp_plan_grz, input_select.hp_cwu_tryb_w_oknie, input_select.hp_cwu_tryb_poza, input_select.hp_cwu_tryb_tania, input_number.hp_cwu_czekaj_min, input_number.hp_cyrk_praca, input_number.hp_cyrk_postoj, input_number.hp_noc_przesuniecie, input_number.hp_dzien_przesuniecie, input_text.hp_g12_strefy, input_boolean.hp_g12_weekend_tani, input_text.hp_cyrk_plan]
      # v1.38: zmiana okien harmonogramu (karta zapisuje schedule) -> od razu do ESP
      - trigger: state
        entity_id: [schedule.hp_plan_tryb_cwu, schedule.hp_plan_cyrkulacja_cwu, schedule.hp_plan_obnizenie_co, schedule.hp_plan_grzalka]
      # v1.39: automatyczny plan CWU z Nauki (karta) -> od razu do ESP
      - trigger: state
        entity_id: input_text.hp_cwu_plan
      - trigger: state
        entity_id: [text.hydrolution_plan_offline_parametry, text.hydrolution_plan_offline_cwu, text.hydrolution_plan_offline_cyrkulacja]
        from: unavailable
      # v1.39: co 5 min sprawdza, co ESP ma w sobie, i dosyla braki (wczesniej co 15 min)
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    actions:
      - delay: {seconds: 5}
      # v1.39: ESP niedostepny -> zapisz stan i koniec
      - if:
          - condition: template
            value_template: "{{ states('text.hydrolution_plan_offline_parametry') in ['unavailable', 'unknown'] or states('text.hydrolution_plan_offline_cwu') in ['unavailable', 'unknown'] }}"
        then:
          - if:
              - condition: template
                value_template: "{{ states('input_text.hp_esp_plan_status') not in ['unavailable', 'unknown'] and not states('input_text.hp_esp_plan_status').startswith('ESP offline') }}"
            then:
              - action: input_text.set_value
                target: {entity_id: input_text.hp_esp_plan_status}
                data: {value: "ESP offline od {{ now().strftime('%H:%M') }}"}
          - stop: "ESP niedostepny"
      - variables:
          lista: "{{ ['schedule.hp_plan_tryb_cwu', 'schedule.hp_plan_cyrkulacja_cwu', 'schedule.hp_plan_obnizenie_co', 'schedule.hp_plan_grzalka'] | select('in', states.schedule | map(attribute='entity_id') | list) | list }}"
      - if:
          - condition: template
            value_template: "{{ lista | count > 0 }}"
        then:
          - action: schedule.get_schedule
            target: {entity_id: "{{ lista }}"}
            response_variable: harm
            continue_on_error: true
      - variables:
          sch: "{{ harm if harm is defined and harm is mapping else {} }}"
          auto_cwu: "{{ is_state('input_boolean.hp_auto_cwu', 'on') }}"
          cwu_pusty: >-
            {%- set sd = (sch.get('schedule.hp_plan_tryb_cwu') or {}) if sch is mapping else {} -%}
            {{ sd.values() | map('count') | sum == 0 if sd is mapping else true }}
          m_cwu: >-
            {%- set pc = states('input_text.hp_cwu_plan') -%}
            {%- if auto_cwu and pc | length == 168 and pc | regex_match('^[0-9a-f]+$') -%}
            {%- set dws = none -%}{{- pc -}}
            {%- elif auto_cwu and cwu_pusty -%}
            {%- set s = states('input_text.hp_g12_strefy') -%}
            {%- if s in ['', 'unknown', 'unavailable'] -%}{%- set s = '22:00-06:00,13:00-15:00' -%}{%- endif -%}
            {%- set zz = namespace(l=[]) -%}
            {%- for z in s.split(',') -%}{%- set p = z.strip().split('-') -%}{%- if p | count == 2 and ':' in p[0] and ':' in p[1] -%}
            {%- set a = (p[0].split(':')[0] | int(0)) * 60 + (p[0].split(':')[1] | int(0)) -%}
            {%- set b = (p[1].split(':')[0] | int(0)) * 60 + (p[1].split(':')[1] | int(0)) -%}
            {%- if b > a -%}{%- set zz.l = zz.l + [[a, b]] -%}{%- else -%}{%- set zz.l = zz.l + [[a, 1440], [0, b]] -%}{%- endif -%}
            {%- endif -%}{%- endfor -%}
            {%- set we = is_state('input_boolean.hp_g12_weekend_tani', 'on') -%}
            {%- set acc = namespace(l=[]) -%}
            {%- for d in range(7) -%}{%- set acc.l = acc.l + [zz.l + ([[0, 1440]] if we and d >= 5 else [])] -%}{%- endfor -%}
            {%- set dws = acc.l -%}
            {%- else -%}
            {%- set sd = (sch.get('schedule.hp_plan_tryb_cwu') or {}) if sch is mapping else {} -%}
            {%- set acc = namespace(l=[]) -%}
            {%- for dn in ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] -%}{%- set ws = namespace(l=[]) -%}
            {%- for w in (sd.get(dn) or []) -%}
            {%- set a = (w['from'] | string).split(':') -%}{%- set b = (w['to'] | string).split(':') -%}
            {%- set fm = (a[0] | int(0)) * 60 + (a[1] | int(0)) -%}{%- set tm = (b[0] | int(0)) * 60 + (b[1] | int(0)) -%}
            {%- set ws.l = ws.l + [[fm, 1440 if tm == 0 else tm]] -%}
            {%- endfor -%}{%- set acc.l = acc.l + [ws.l] -%}{%- endfor -%}
            {%- set dws = acc.l -%}
            {%- endif -%}
            {%- if dws is not none -%}
            {%- set ns = namespace(h='') -%}
            {%- for dw in dws -%}{%- for q in range(24) -%}{%- set nb = namespace(v=0) -%}
            {%- for i in range(4) -%}{%- set m = (q * 4 + i) * 15 -%}{%- set on = namespace(b=false) -%}
            {%- for w in dw -%}{%- if w[0] <= m < w[1] -%}{%- set on.b = true -%}{%- endif -%}{%- endfor -%}
            {%- if on.b -%}{%- set nb.v = nb.v + 2 ** (3 - i) -%}{%- endif -%}
            {%- endfor -%}{%- set ns.h = ns.h ~ '0123456789abcdef'[nb.v] -%}{%- endfor -%}{%- endfor -%}
            {{- ns.h -}}
            {%- endif -%}
          m_cyrk: >-
            {%- set pl = states('input_text.hp_cyrk_plan') -%}
            {%- if is_state('input_boolean.hp_auto_cyrk', 'on') and pl | length == 168 -%}
            {{- pl -}}
            {%- else -%}
            {%- set sd = (sch.get('schedule.hp_plan_cyrkulacja_cwu') or {}) if sch is mapping else {} -%}
            {%- set acc = namespace(l=[]) -%}
            {%- for dn in ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] -%}{%- set ws = namespace(l=[]) -%}
            {%- for w in (sd.get(dn) or []) -%}
            {%- set a = (w['from'] | string).split(':') -%}{%- set b = (w['to'] | string).split(':') -%}
            {%- set fm = (a[0] | int(0)) * 60 + (a[1] | int(0)) -%}{%- set tm = (b[0] | int(0)) * 60 + (b[1] | int(0)) -%}
            {%- set ws.l = ws.l + [[fm, 1440 if tm == 0 else tm]] -%}
            {%- endfor -%}{%- set acc.l = acc.l + [ws.l] -%}{%- endfor -%}
            {%- set dws = acc.l -%}
            {%- set ns = namespace(h='') -%}
            {%- for dw in dws -%}{%- for q in range(24) -%}{%- set nb = namespace(v=0) -%}
            {%- for i in range(4) -%}{%- set m = (q * 4 + i) * 15 -%}{%- set on = namespace(b=false) -%}
            {%- for w in dw -%}{%- if w[0] <= m < w[1] -%}{%- set on.b = true -%}{%- endif -%}{%- endfor -%}
            {%- if on.b -%}{%- set nb.v = nb.v + 2 ** (3 - i) -%}{%- endif -%}
            {%- endfor -%}{%- set ns.h = ns.h ~ '0123456789abcdef'[nb.v] -%}{%- endfor -%}{%- endfor -%}
            {{- ns.h -}}
            {%- endif -%}
          m_noc: >-
            {%- set sd = (sch.get('schedule.hp_plan_obnizenie_co') or {}) if sch is mapping else {} -%}
            {%- set acc = namespace(l=[]) -%}
            {%- for dn in ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] -%}{%- set ws = namespace(l=[]) -%}
            {%- for w in (sd.get(dn) or []) -%}
            {%- set a = (w['from'] | string).split(':') -%}{%- set b = (w['to'] | string).split(':') -%}
            {%- set fm = (a[0] | int(0)) * 60 + (a[1] | int(0)) -%}{%- set tm = (b[0] | int(0)) * 60 + (b[1] | int(0)) -%}
            {%- set ws.l = ws.l + [[fm, 1440 if tm == 0 else tm]] -%}
            {%- endfor -%}{%- set acc.l = acc.l + [ws.l] -%}{%- endfor -%}
            {%- set dws = acc.l -%}
            {%- set ns = namespace(h='') -%}
            {%- for dw in dws -%}{%- for q in range(24) -%}{%- set nb = namespace(v=0) -%}
            {%- for i in range(4) -%}{%- set m = (q * 4 + i) * 15 -%}{%- set on = namespace(b=false) -%}
            {%- for w in dw -%}{%- if w[0] <= m < w[1] -%}{%- set on.b = true -%}{%- endif -%}{%- endfor -%}
            {%- if on.b -%}{%- set nb.v = nb.v + 2 ** (3 - i) -%}{%- endif -%}
            {%- endfor -%}{%- set ns.h = ns.h ~ '0123456789abcdef'[nb.v] -%}{%- endfor -%}{%- endfor -%}
            {{- ns.h -}}
          m_grz: >-
            {%- set sd = (sch.get('schedule.hp_plan_grzalka') or {}) if sch is mapping else {} -%}
            {%- set acc = namespace(l=[]) -%}
            {%- for dn in ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] -%}{%- set ws = namespace(l=[]) -%}
            {%- for w in (sd.get(dn) or []) -%}
            {%- set a = (w['from'] | string).split(':') -%}{%- set b = (w['to'] | string).split(':') -%}
            {%- set fm = (a[0] | int(0)) * 60 + (a[1] | int(0)) -%}{%- set tm = (b[0] | int(0)) * 60 + (b[1] | int(0)) -%}
            {%- set ws.l = ws.l + [[fm, 1440 if tm == 0 else tm]] -%}
            {%- endfor -%}{%- set acc.l = acc.l + [ws.l] -%}{%- endfor -%}
            {%- set dws = acc.l -%}
            {%- set ns = namespace(h='') -%}
            {%- for dw in dws -%}{%- for q in range(24) -%}{%- set nb = namespace(v=0) -%}
            {%- for i in range(4) -%}{%- set m = (q * 4 + i) * 15 -%}{%- set on = namespace(b=false) -%}
            {%- for w in dw -%}{%- if w[0] <= m < w[1] -%}{%- set on.b = true -%}{%- endif -%}{%- endfor -%}
            {%- if on.b -%}{%- set nb.v = nb.v + 2 ** (3 - i) -%}{%- endif -%}
            {%- endfor -%}{%- set ns.h = ns.h ~ '0123456789abcdef'[nb.v] -%}{%- endfor -%}{%- endfor -%}
            {{- ns.h -}}
          lit: "{{ {'Ekonomiczny': 'E', 'Normalny': 'N', 'Luksus': 'L', 'Smart': 'S'} }}"
          c_in: "{{ lit.get(states('input_select.hp_cwu_tryb_tania') if auto_cwu else states('input_select.hp_cwu_tryb_w_oknie'), 'E' if auto_cwu else 'L') }}"
          c_out: "{{ lit.get(states('input_select.hp_cwu_tryb_poza'), 'N') }}"
          flagi: >-
            {{ '1' if auto_cwu or is_state('input_boolean.hp_plan_cwu', 'on') else '0' -}}
            {{ '1' if is_state('input_boolean.hp_auto_cyrk', 'on') or is_state('input_boolean.hp_plan_cyrk', 'on') else '0' -}}
            {{ '1' if is_state('input_boolean.hp_plan_noc', 'on') else '0' -}}
            {{ '1' if is_state('input_boolean.hp_plan_grz', 'on') else '0' }}
          tresc: >-
            {{ c_in }},{{ c_out }},{{ (states('input_number.hp_cwu_czekaj_min') | int(30)) if auto_cwu else 0 }},{{ states('input_number.hp_cyrk_praca') | int(60) }},{{ [1, states('input_number.hp_cyrk_postoj') | int(1)] | max }},{{ states('input_number.hp_noc_przesuniecie') | int(0) }},{{ states('input_number.hp_dzien_przesuniecie') | int(0) }},{{ flagi }}
          # v1.39: czego brakuje w ESP (porownanie z tym, co ESP ma w sobie)
          braki: >-
            {%- set ns = namespace(b=[]) -%}
            {%- if states('text.hydrolution_plan_offline_cwu') != m_cwu -%}{%- set ns.b = ns.b + ['CWU'] -%}{%- endif -%}
            {%- if states('text.hydrolution_plan_offline_cyrkulacja') != m_cyrk -%}{%- set ns.b = ns.b + ['cyrkulacja'] -%}{%- endif -%}
            {%- if states('text.hydrolution_plan_offline_noc') != m_noc -%}{%- set ns.b = ns.b + ['obnizenie CO'] -%}{%- endif -%}
            {%- if states('text.hydrolution_plan_offline_grzalka') != m_grz -%}{%- set ns.b = ns.b + ['grzalka'] -%}{%- endif -%}
            {%- if (states('text.hydrolution_plan_offline_parametry').split(',')[:8] | join(',')) != tresc -%}{%- set ns.b = ns.b + ['parametry'] -%}{%- endif -%}
            {{ ns.b }}
      - condition: template
        value_template: "{{ m_cwu | length == 168 and m_cyrk | length == 168 }}"
      # v1.39: dosylanie brakow z weryfikacja: zapis -> 15 s -> ponowny odczyt z ESP, najwyzej 3 proby
      - if:
          - condition: template
            value_template: "{{ braki | count > 0 }}"
        then:
          - repeat:
              sequence:
                - repeat:
                    for_each:
                      - {e: text.hydrolution_plan_offline_cwu, v: "{{ m_cwu }}"}
                      - {e: text.hydrolution_plan_offline_cyrkulacja, v: "{{ m_cyrk }}"}
                      - {e: text.hydrolution_plan_offline_noc, v: "{{ m_noc }}"}
                      - {e: text.hydrolution_plan_offline_grzalka, v: "{{ m_grz }}"}
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(repeat.item.e) != repeat.item.v }}"
                        then:
                          - action: text.set_value
                            target: {entity_id: "{{ repeat.item.e }}"}
                            data: {value: "{{ repeat.item.v }}"}
                            continue_on_error: true
                - if:
                    - condition: template
                      value_template: "{{ (states('text.hydrolution_plan_offline_parametry').split(',')[:8] | join(',')) != tresc or repeat.index == 1 }}"
                  then:
                    - action: text.set_value
                      target: {entity_id: text.hydrolution_plan_offline_parametry}
                      data: {value: "{{ tresc }},{{ now().strftime('%Y-%m-%d %H:%M') }}"}
                      continue_on_error: true
                - delay: {seconds: 15}
              until:
                - condition: template
                  value_template: >-
                    {{ repeat.index >= 3 or ((states('text.hydrolution_plan_offline_cwu') == m_cwu) and (states('text.hydrolution_plan_offline_cyrkulacja') == m_cyrk) and (states('text.hydrolution_plan_offline_noc') == m_noc) and (states('text.hydrolution_plan_offline_grzalka') == m_grz) and ((states('text.hydrolution_plan_offline_parametry').split(',')[:8] | join(',')) == tresc)) }}
      - variables:
          braki2: >-
            {%- set ns = namespace(b=[]) -%}
            {%- if states('text.hydrolution_plan_offline_cwu') != m_cwu -%}{%- set ns.b = ns.b + ['CWU'] -%}{%- endif -%}
            {%- if states('text.hydrolution_plan_offline_cyrkulacja') != m_cyrk -%}{%- set ns.b = ns.b + ['cyrkulacja'] -%}{%- endif -%}
            {%- if states('text.hydrolution_plan_offline_noc') != m_noc -%}{%- set ns.b = ns.b + ['obnizenie CO'] -%}{%- endif -%}
            {%- if states('text.hydrolution_plan_offline_grzalka') != m_grz -%}{%- set ns.b = ns.b + ['grzalka'] -%}{%- endif -%}
            {%- if (states('text.hydrolution_plan_offline_parametry').split(',')[:8] | join(',')) != tresc -%}{%- set ns.b = ns.b + ['parametry'] -%}{%- endif -%}
            {{ ns.b }}
          stan: "{{ 'OK' if braki2 | count == 0 else 'brak: ' ~ (braki2 | join(', ')) ~ ' (3 proby, ' ~ now().strftime('%H:%M') ~ ')' }}"
      - if:
          - condition: template
            value_template: "{{ states('input_text.hp_esp_plan_status') not in ['unavailable', 'unknown'] and states('input_text.hp_esp_plan_status') != stan }}"
        then:
          - action: input_text.set_value
            target: {entity_id: input_text.hp_esp_plan_status}
            data: {value: "{{ stan }}"}
