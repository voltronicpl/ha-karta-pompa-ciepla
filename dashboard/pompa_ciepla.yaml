# =====================================================================
# Dashboard HA "Pompa ciepla" - MHI Hydrolution (ESPHome hydrolution v5.3)
# Wymaga (HACS -> Frontend): button-card, apexcharts-card, card-mod
# Tlo: /config/www/hydrolution/tlo.png  (-> /local/hydrolution/tlo.png)
# Wklej CALOSC w: Ustawienia -> Dashboardy -> nowy dashboard -> Edytuj -> 3 kropki -> Edytor kodu (raw)
# Plik wygenerowany - pozycje w % tla 1672x941, czcionki skalowane do szerokosci karty (cqw).
# =====================================================================
title: Pompa ciepła
button_card_templates:
  hp:
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
      - padding: '0'
      - margin: '0'
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: '0'
      - height: 100%
      - width: 100%
      - overflow: visible
      - color: '#eef2f6'
      - font-family: '''Segoe UI'', Roboto, ''Noto Sans'', ''Open Sans'', sans-serif'
      - line-height: '1.15'
      - --ha-card-background: none
      - cursor: default
      grid:
      - grid-template-areas: '"c"'
      - grid-template-columns: 100%
      - grid-template-rows: 100%
      - height: 100%
      - width: 100%
      custom_fields:
        c:
        - position: relative
        - height: 100%
        - width: 100%
        - overflow: visible
    extra_styles: |
      :host { --u: calc(100cqw / 1672); }
      .g { position: absolute; inset: 0; box-sizing: border-box;
        background: linear-gradient(180deg, rgba(42,48,58,.80), rgba(20,24,31,.86));
        border: 1px solid rgba(255,255,255,.13); border-radius: calc(var(--u) * 9);
        box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 18) rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
        -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
  hp_hit:
    template: hp
    styles:
      card:
      - cursor: pointer
views:
- title: Pompa ciepła
  path: pompa-ciepla
  type: panel
  icon: mdi:heat-pump
  cards:
  - type: picture-elements
    image: /local/hydrolution/tlo.png
    card_mod:
      style: |
        ha-card { container-type: inline-size; overflow: hidden; border-radius: 12px; }
    elements:
    - type: custom:button-card
      template: hp
      custom_fields:
        c: |-
          [[[
          const OX=25,OY=50;const u=v=>'calc(var(--u)*'+v+')';const F=(s,w,c)=>'font-size:'+u(s)+';font-weight:'+(w||400)+';color:'+(c||'#eef2f6')+';';const B=(x,y,h,c,t)=>'<div style="position:absolute;left:'+u(x-OX)+';top:'+u(y-OY)+';transform:'+t+';white-space:nowrap;'+(c||'')+'">'+h+'</div>';const P=(x,y,h,c)=>B(x,y,h,c,'translateY(-50%)');
          return '<div style="position:absolute;left:'+u(3)+';top:'+u(3)+';width:'+u(62)+';height:'+u(55)+'"><svg viewBox="6 2 52 45" style="width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))"><polygon points="32.00,32.00 40.66,17.00 32.00,2.00 23.34,17.00" fill="#e60012"/><polygon points="32.00,32.00 40.66,47.00 57.98,47.00 49.32,32.00" fill="#e60012"/><polygon points="32.00,32.00 14.68,32.00 6.02,47.00 23.34,47.00" fill="#e60012"/></svg></div>'
           + P(100,69,'MHI Hydrolution 9 kW',F(33,700,'#ffffff')+'letter-spacing:.2px;text-shadow:0 2px 6px rgba(0,0,0,.6)')
           + P(103,98,'Obieg grzewczy CO &nbsp;•&nbsp; Ciepła woda użytkowa CWU &nbsp;•&nbsp; Cyrkulacja',F(16,400,'#cfd6de')+'text-shadow:0 1px 4px rgba(0,0,0,.7)');
          ]]]
      style:
        left: 1.495%
        top: 5.313%
        width: 33.493%
        height: 6.589%
        transform: none
    - type: custom:button-card
      template: hp_hit
      tap_action:
        action: more-info
